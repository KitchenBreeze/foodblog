name: KitchenBreeze Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python Version prüfen
        run: python --version

      - name: Generator testen
        run: python generator/build-generator.py