name: KitchenBreeze Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python Version prüfen
        run: python --version

      - name: Generator testen
        run: python generator/build-generator.py

      - name: Erzeugte Dateien speichern
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisch erzeugte Rezeptseiten aktualisiert"