name: KitchenBreeze Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Testdatei erzeugen
        run: |
          mkdir -p build-output
          echo "KitchenBreeze automatischer Build funktioniert!" > build-output/test-build.html

      - name: Ergebnis anzeigen
        run: ls -la build-output