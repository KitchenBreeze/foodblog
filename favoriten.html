<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meine Favoriten - KitchenBreeze</title>
<link rel="icon" type="image/png" href="logo1.png">

<style>

body {
    margin:0;
    font-family:Georgia, serif;
    background:#0f0f10;
    color:#f2eee9;
}

.container {
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1 {
    text-align:center;
    font-weight:300;
}

.back {
    color:#b8b2aa;
    text-decoration:none;
}


.recipe-card {

    display:flex;
    gap:20px;

    background:#171718;

    padding:15px;

    border-radius:16px;

    margin-top:20px;

}


.recipe-card img {

    width:120px;
    height:120px;

    object-fit:cover;

    border-radius:12px;

}


a {
    color:white;
    text-decoration:none;
}

@media (max-width: 600px) {

    .recipe-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .recipe-card img {
        width: 100%;
        max-width: 300px;
        height: 180px;
        border-radius: 12px;
    }

    .recipe-card h2 {
        margin-top: 15px;
    }

}
.recipe-card div {
    width: 100%;
    box-sizing: border-box;
}


</style>

</head>


<body>


<div class="container">


<a class="back" href="index.html">
← Zurück
</a>


<h1>
❤️ Meine Favoriten
</h1>


<div id="favorites"></div>


</div>



<script src="recipes.js"></script>


<script>

/* =========================================
   FAVORITEN LADEN
========================================= */

const container = document.getElementById("favorites");

let favorites = [];

try {

    favorites = JSON.parse(
        localStorage.getItem("kitchenBreezeFavorites") || "[]"
    );

    if (!Array.isArray(favorites)) {
        favorites = [];
    }

    favorites = favorites.map(String);

} catch (error) {

    favorites = [];

}


/* =========================================
   REZEPTE FILTERN
========================================= */

const favoriteRecipes = RECIPES.filter(recipe =>
    favorites.includes(String(recipe.id))
);


/* =========================================
   KEINE FAVORITEN
========================================= */

if (favoriteRecipes.length === 0) {

    container.innerHTML = `
        <p style="text-align:center;color:#b8b2aa;">
            Noch keine Favoriten gespeichert.
        </p>
    `;

}


/* =========================================
   FAVORITEN AUSGEBEN
========================================= */

favoriteRecipes.forEach(recipe => {

    const recipeUrl =
        `recipes/${String(recipe.title || "")
            .toLowerCase()
            .replaceAll("ä", "ae")
            .replaceAll("ö", "oe")
            .replaceAll("ü", "ue")
            .replaceAll("ß", "ss")
            .replace(/[^a-z0-9\s-]/g, "")
            .replace(/\s+/g, "-")
            .replace(/-+/g, "-")
            .replace(/^-|-$/g, "")
        }.html`;

    container.innerHTML += `

        <div class="recipe-card">

            <a href="${recipeUrl}">

                <img
                    src="${recipe.image}"
                    alt="${recipe.title}"
                    loading="lazy"
                >

            </a>

            <div>

                <a href="${recipeUrl}">

                    <h2>${recipe.title}</h2>

                </a>

                <p>${recipe.description || ""}</p>

                <button
                    class="favorite-button is-favorite"
                    data-favorite-id="${recipe.id}"
                    type="button"
                    aria-label="Aus Favoriten entfernen"
                    aria-pressed="true"
                >
                    ♥
                </button>

            </div>

        </div>

    `;

});


/* =========================================
   FAVORITEN ENTFERNEN
========================================= */

container.addEventListener("click", function(event) {

    const button = event.target.closest(".favorite-button");

    if (!button) {
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    const recipeId = String(button.dataset.favoriteId);

    favorites = favorites.filter(
        id => id !== recipeId
    );

    try {

        localStorage.setItem(
            "kitchenBreezeFavorites",
            JSON.stringify(favorites)
        );

    } catch (error) {

        console.error(
            "Favoriten konnten nicht gespeichert werden:",
            error
        );

        return;

    }

    const card = button.closest(".recipe-card");

    if (card) {
        card.remove();
    }

    if (favorites.length === 0) {

        container.innerHTML = `
            <p style="text-align:center;color:#b8b2aa;">
                Noch keine Favoriten gespeichert.
            </p>
        `;

    }

});

</script>


</body>

</html>
