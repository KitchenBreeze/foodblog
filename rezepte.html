<script>


/* =========================================
   SLUG ERSTELLEN
========================================= */

function createSlug(title) {

    return String(title || "")
        .toLowerCase()
        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("ß", "ss")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");

}


/* =========================================
   ELEMENTE
========================================= */

const grid =
    document.getElementById("recipeGrid");

const searchInput =
    document.getElementById("searchInput");

const filterBtn =
    document.getElementById("filterBtn");

const filterDropdown =
    document.getElementById("filterDropdown");

const filterItems =
    document.querySelectorAll(".filter-item");


/* =========================================
   RECIPES PRÜFEN
========================================= */

if (typeof RECIPES === "undefined") {

    console.error(
        "❌ RECIPES ist nicht geladen! recipes.js prüfen!"
    );

}


/* =========================================
   URL AUSLESEN
========================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const urlCategories =
    urlParams.get("categories");


const urlQuick =
    urlParams.get("quick") === "true";


const urlSearch =
    urlParams.get("search") || "";


/* =========================================
   AUS URL GELADENE KATEGORIEN
========================================= */

let selectedCategories = [];


if (urlCategories) {

    selectedCategories =
        urlCategories
            .split(",")
            .map(category => {

                try {

                    return decodeURIComponent(
                        category
                    );

                }

                catch {

                    return category;

                }

            })
            .filter(Boolean);

}


if (
    selectedCategories.length === 0
) {

    selectedCategories = ["all"];

}


/* =========================================
   SUCHE AUS URL WIEDERHERSTELLEN
========================================= */

if (searchInput) {

    searchInput.value = urlSearch;

}


/* =========================================
   FILTER BUTTONS AKTUALISIEREN
========================================= */

function updateFilterButtons() {

    filterItems.forEach(item => {

        const category =
            item.dataset.cat;

        item.classList.remove("active");


        if (
            selectedCategories.includes(
                category
            )
        ) {

            item.classList.add("active");

        }

    });


    if (
        selectedCategories.includes("all")
    ) {

        const allButton =
            document.querySelector(
                '[data-cat="all"]'
            );


        if (allButton) {

            allButton.classList.add(
                "active"
            );

        }

    }

}


/* =========================================
   URL AKTUALISIEREN
========================================= */

function updateUrl() {


    const params =
        new URLSearchParams();


    /* -------------------------------------
       KATEGORIEN
    ------------------------------------- */

    const categories =
        selectedCategories.filter(
            category =>
                category !== "all"
        );


    if (
        categories.length > 0
    ) {

        params.set(
            "categories",
            categories
                .map(category =>
                    encodeURIComponent(
                        category
                    )
                )
                .join(",")
        );

    }


    /* -------------------------------------
       SCHNELLFILTER
    ------------------------------------- */

    if (urlQuick) {

        params.set(
            "quick",
            "true"
        );

    }


    /* -------------------------------------
       SUCHE
    ------------------------------------- */

    const search =
        searchInput
            ? searchInput.value.trim()
            : "";


    if (search) {

        params.set(
            "search",
            search
        );

    }


    /* -------------------------------------
       URL SETZEN
    ------------------------------------- */

    const query =
        params.toString();


    const newUrl =
        query
            ? `${window.location.pathname}?${query}`
            : window.location.pathname;


    window.history.replaceState(
        {},
        "",
        newUrl
    );

}


/* =========================================
   FILTER MENÜ ÖFFNEN / SCHLIESSEN
========================================= */

if (
    filterBtn &&
    filterDropdown
) {


    filterBtn.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            filterDropdown.classList.toggle(
                "open"
            );

        }
    );


    document.addEventListener(
        "click",
        event => {

            if (
                !filterDropdown.contains(
                    event.target
                ) &&
                event.target !== filterBtn
            ) {

                filterDropdown.classList.remove(
                    "open"
                );

            }

        }
    );

}


/* =========================================
   KATEGORIEN
========================================= */

filterItems.forEach(item => {


    item.addEventListener(
        "click",
        () => {


            const category =
                item.dataset.cat;


            /* =============================
               ALLE
            ============================= */

            if (
                category === "all"
            ) {

                selectedCategories = [
                    "all"
                ];

                updateFilterButtons();

                updateUrl();

                render();

                return;

            }


            /* =============================
               ALLE ENTFERNEN
            ============================= */

            selectedCategories =
                selectedCategories.filter(
                    cat =>
                        cat !== "all"
                );


            /* =============================
               FILTER AN / AUS
            ============================= */

            if (
                selectedCategories.includes(
                    category
                )
            ) {

                selectedCategories =
                    selectedCategories.filter(
                        cat =>
                            cat !== category
                    );

            }

            else {

                selectedCategories.push(
                    category
                );

            }


            /* =============================
               KEIN FILTER
            ============================= */

            if (
                selectedCategories.length === 0
            ) {

                selectedCategories = [
                    "all"
                ];

            }


            updateFilterButtons();

            updateUrl();

            render();

        }
    );

});


/* =========================================
   SUCHE
========================================= */

if (searchInput) {

    searchInput.addEventListener(
        "input",
        () => {

            updateUrl();

            render();

        }
    );

}


/* =========================================
   GESAMTZEIT IN MINUTEN
========================================= */

function getTotalMinutes(recipe) {


    if (
        !recipe ||
        !recipe.time ||
        !recipe.time.total
    ) {

        return Infinity;

    }


    const time =
        String(
            recipe.time.total
        )
        .toLowerCase()
        .trim();


    let minutes = 0;


    /* =====================================
       STUNDEN
    ===================================== */

    const hoursMatch =
        time.match(
            /(\d+(?:[.,]\d+)?)\s*(?:stunden?|std\.?|h)/
        );


    if (hoursMatch) {

        minutes +=
            parseFloat(
                hoursMatch[1]
                    .replace(
                        ",",
                        "."
                    )
            ) * 60;

    }


    /* =====================================
       MINUTEN
    ===================================== */

    const minutesMatch =
        time.match(
            /(\d+)\s*(?:minuten?|min\.?|m)/
        );


    if (minutesMatch) {

        minutes +=
            parseInt(
                minutesMatch[1],
                10
            );

    }


    /* =====================================
       NUR ZAHL
    ===================================== */

    if (
        !hoursMatch &&
        !minutesMatch
    ) {

        const numberOnly =
            time.match(
                /^\d+$/
            );


        if (numberOnly) {

            minutes =
                parseInt(
                    numberOnly[0],
                    10
                );

        }

    }


    return minutes || Infinity;

}


/* =========================================
   ZUTATEN FÜR SUCHE
========================================= */

function getIngredientsText(recipe) {


    if (
        !recipe ||
        !recipe.ingredients
    ) {

        return "";

    }


    /* =====================================
       ARRAY
    ===================================== */

    if (
        Array.isArray(
            recipe.ingredients
        )
    ) {

        return recipe.ingredients
            .join(" ")
            .toLowerCase();

    }


    /* =====================================
       OBJEKT
    ===================================== */

    if (
        typeof recipe.ingredients ===
        "object"
    ) {

        return Object.values(
            recipe.ingredients
        )
        .flat()
        .join(" ")
        .toLowerCase();

    }


    return String(
        recipe.ingredients
    ).toLowerCase();

}


/* =========================================
   RENDER
========================================= */

function render() {


    if (
        typeof RECIPES ===
        "undefined"
    ) {

        console.error(
            "❌ RECIPES fehlt! recipes.js prüfen!"
        );

        return;

    }


    if (!grid) {

        return;

    }


    const search =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";


    /* =====================================
       REZEPTE FILTERN
    ===================================== */

    const filtered =

        RECIPES
            .slice()


            /* =============================
               NEUESTE ZUERST
            ============================= */

            .sort(
                (a, b) =>
                    Number(b.id) -
                    Number(a.id)
            )


/* =============================
   KATEGORIEN
============================= */

.filter(recipe => {

    if (
        selectedCategories.includes("all") ||
        selectedCategories.length === 0
    ) {
        return true;
    }

    const categories =
        Array.isArray(recipe.category)
            ? recipe.category
            : [];

    // Alle ausgewählten Filter zerlegen
    const selected = selectedCategories.map(
        category => {

            const parts = category.split("|");

            return {
                main: parts[0],
                sub: parts[1] || null
            };

        }
    );

    // Hauptkategorien herausfiltern
    const mainCategories = selected.filter(
        item => !item.sub
    );

    // Unterkategorien herausfiltern
    const subCategories = selected.filter(
        item => item.sub
    );

    // Hauptkategorien müssen passen
    const mainMatches =
        mainCategories.length === 0 ||
        mainCategories.some(
            item => categories.includes(item.main)
        );

    // Vegan und Vegetarisch müssen passen,
    // alle anderen Unterkategorien dürfen ODER sein
    const dietaryCategories =
        subCategories.filter(
            item =>
                item.sub === "Vegan" ||
                item.sub === "Vegetarisch"
        );

    const otherCategories =
        subCategories.filter(
            item =>
                item.sub !== "Vegan" &&
                item.sub !== "Vegetarisch"
        );

    const dietaryMatches =
        dietaryCategories.every(
            item =>
                categories.includes(item.main) &&
                categories.includes(item.sub)
        );

    const otherMatches =
        otherCategories.length === 0 ||
        otherCategories.some(
            item =>
                categories.includes(item.main) &&
                categories.includes(item.sub)
        );

    return (
        mainMatches &&
        dietaryMatches &&
        otherMatches
    );

})
            /* =============================
               SUCHE
            ============================= */

            .filter(recipe => {


                if (!search) {

                    return true;

                }


                const title =
                    String(
                        recipe.title ||
                        ""
                    )
                    .toLowerCase();


                const description =
                    String(
                        recipe.description ||
                        ""
                    )
                    .toLowerCase();


                const ingredients =
                    getIngredientsText(
                        recipe
                    );


                const category =
                    Array.isArray(
                        recipe.category
                    )
                        ? recipe.category
                            .join(" ")
                            .toLowerCase()
                        : String(
                            recipe.category ||
                            ""
                        ).toLowerCase();


                return (

                    title.includes(
                        search
                    )

                    ||

                    description.includes(
                        search
                    )

                    ||

                    ingredients.includes(
                        search
                    )

                    ||

                    category.includes(
                        search
                    )

                );

            });


    /* =====================================
       GRID LEEREN
    ===================================== */

    grid.innerHTML = "";


    /* =====================================
       REZEPTE AUSGEBEN
    ===================================== */

    filtered.forEach(recipe => {


        /* =================================
           PARAMETER FÜR REZEPTSEITE
        ================================= */

        const params =
            new URLSearchParams();


        /* ---------------------------------
           KATEGORIEN
        --------------------------------- */

        const activeCategories =
            selectedCategories.filter(
                category =>
                    category !== "all"
            );


        if (
            activeCategories.length > 0
        ) {

            params.set(
                "categories",
                activeCategories
                    .map(category =>
                        encodeURIComponent(
                            category
                        )
                    )
                    .join(",")
            );

        }


        /* ---------------------------------
           SCHNELLFILTER
        --------------------------------- */

        if (urlQuick) {

            params.set(
                "quick",
                "true"
            );

        }


        /* ---------------------------------
           SUCHE
        --------------------------------- */

        if (search) {

            params.set(
                "search",
                search
            );

        }


        /* =================================
           REZEPT URL
        ================================= */

        let recipeUrl =
            `recipes/${createSlug(
                recipe.title
            )}.html`;


        const query =
            params.toString();


        if (query) {

            recipeUrl +=
                `?${query}`;

        }


        /* =================================
           REZEPTKARTE
        ================================= */

        grid.innerHTML += `

            <a
                class="recipe-card"
                href="${recipeUrl}"
            >

                <div
                    class="recipe-card-image"
                >

                    <img
                        src="${recipe.image}"
                        alt="${recipe.title}"
                        loading="lazy"
                    >

                </div>


                <div
                    class="recipe-card-content"
                >

                    <h2>
                        ${recipe.title}
                    </h2>


                    <p>
                        ${recipe.description || ""}
                    </p>

                </div>

            </a>

        `;

    });


    /* =====================================
       KEINE ERGEBNISSE
    ===================================== */

    if (
        !filtered.length
    ) {


        let message =
            "Versuche eine andere Suche oder Kategorie.";


        if (
            urlQuick &&
            !search
        ) {

            message =
                "Es gibt keine Rezepte mit einer Gesamtzeit von höchstens 45 Minuten.";

        }


        grid.innerHTML = `

            <div
                class="no-results"
            >

                <h2>
                    Keine Rezepte gefunden
                </h2>

                <p>
                    ${message}
                </p>

            </div>

        `;

    }

}


/* =========================================
   FILTER AUS URL AKTIVIEREN
========================================= */

updateFilterButtons();


/* =========================================
   START
========================================= */

render();


</script>

<script>
/* =========================================
   SCROLLPOSITION DER REZEPTSEITE MERKEN
========================================= */

const RECIPE_SCROLL_KEY =
    "kitchenbreeze_recipe_scroll";


/* =========================================
   BROWSER-SCROLL-WIEDERHERSTELLUNG DEAKTIVIEREN
========================================= */

if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
}


/* =========================================
   SCROLLPOSITION SPEICHERN
========================================= */

function saveRecipeScrollPosition() {

    sessionStorage.setItem(
        RECIPE_SCROLL_KEY,
        String(window.scrollY)
    );

}


/* =========================================
   BEIM ÖFFNEN EINES REZEPTS SPEICHERN
========================================= */

document.addEventListener(
    "click",
    function(event) {

        const recipeCard =
            event.target.closest(
                ".recipe-card"
            );

        if (!recipeCard) {
            return;
        }

        saveRecipeScrollPosition();

    }
);


/* =========================================
   AUCH BEIM VERLASSEN SPEICHERN
========================================= */

window.addEventListener(
    "pagehide",
    saveRecipeScrollPosition
);


/* =========================================
   POSITION BEIM ZURÜCKKEHREN HERSTELLEN
========================================= */

window.addEventListener(
    "pageshow",
    function() {

        const savedPosition =
            sessionStorage.getItem(
                RECIPE_SCROLL_KEY
            );

        if (
            savedPosition === null
        ) {
            return;
        }


        /*
           Warten, bis die Rezeptkarten
           vollständig gerendert wurden.
        */

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                window.scrollTo(
                    0,
                    Number(savedPosition)
                );

            });

        });

    }
);
</script>

<script>

const menuBtn =
    document.getElementById("menuBtn");

const sideMenu =
    document.getElementById("sideMenu");


menuBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        sideMenu.classList.toggle("open");

        const isOpen =
            sideMenu.classList.contains("open");

        menuBtn.setAttribute(
            "aria-expanded",
            isOpen
        );

    }
);


document.addEventListener(
    "click",
    (event) => {

        if (
            !sideMenu.contains(event.target) &&
            !menuBtn.contains(event.target)
        ) {

            sideMenu.classList.remove("open");

            menuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);

</script>
<button
    id="backToTop"
    class="back-to-top"
    aria-label="Nach oben"
>
    ↑
</button>
<script>

const backToTop =
    document.getElementById("backToTop");


window.addEventListener(
    "scroll",
    () => {

        if (window.scrollY > 400) {

            backToTop.style.display =
                "flex";

        } else {

            backToTop.style.display =
                "none";

        }

    }
);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }
);

</script>
<script>

const categoryButtons =
    document.querySelectorAll(
        "[data-category-toggle]"
    );


categoryButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                const category =
                    button.dataset.categoryToggle;

                const subcategories =
                    document.getElementById(
                        "category-" + category
                    );


                subcategories.classList.toggle(
                    "open"
                );

                button.classList.toggle(
                    "open"
                );

            }
        );

    }
);

</script>
