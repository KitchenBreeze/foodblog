<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Alle KitchenBreeze Rezepte – einfache, selbstgemachte Rezepte zum Kochen und Backen."
>

<title>Rezepte – KitchenBreeze</title>

<link
    rel="icon"
    type="image/png"
    href="facion.png"
>

<link
    rel="stylesheet"
    href="rezepte.css"
>

</head>

<body>

<div class="recipes-back">
    <a href="index.html">← Zur Übersicht</a>
</div>


<!-- =========================================
     KOPF
========================================= -->

<header class="recipes-header">

    <a
        href="index.html"
        class="recipes-logo"
    >

        <img
            src="images/logo1.png"
            alt="KitchenBreeze"
        >

    </a>

</header>



<main>


<!-- =========================================
     TITEL
========================================= -->

<section class="recipes-hero">

    <div class="recipes-hero-inner">

        

        <h1>
            Rezeptsammlung
        </h1>

       

    </div>

</section>



<!-- =========================================
     SUCHE
========================================= -->

<section class="recipes-tools">

    <div class="recipes-search">

        <span class="recipes-search-icon">
            ⌕
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Rezept suchen ..."
            autocomplete="off"
            aria-label="Rezepte durchsuchen"
        >

    </div>



    <div class="filter-container">

        <button
            class="filter-button"
            id="filterBtn"
            type="button"
        >
            Kategorien
            <span>⌄</span>
        </button>


        <div
            class="filter-dropdown"
            id="filterDropdown"
        >

            <button
                class="filter-item active"
                data-cat="all"
                type="button"
            >
                Alle
            </button>

            <button class="filter-item" data-cat="Pasta" type="button">
                Pasta
            </button>

            <button class="filter-item" data-cat="Reis" type="button">
                Reis
            </button>

            <button class="filter-item" data-cat="Suppen & Eintöpfe" type="button">
                Suppen & Eintöpfe
            </button>

            <button class="filter-item" data-cat="Salate" type="button">
                Salate
            </button>

            <button class="filter-item" data-cat="Beilagen" type="button">
                Beilagen
            </button>

            <button class="filter-item" data-cat="Aufstriche & Dips" type="button">
                Aufstriche & Dips
            </button>

            <button class="filter-item" data-cat="Snacks" type="button">
                Snacks
            </button>

            <button class="filter-item" data-cat="süße Hauptgerichte" type="button">
                Süße Hauptgerichte
            </button>

            <button class="filter-item" data-cat="süßes Gebäck" type="button">
                Süßes Gebäck
            </button>

            <button class="filter-item" data-cat="Ofengerichte" type="button">
                Ofengerichte
            </button>

            <button class="filter-item" data-cat="herzhaftes Gebäck" type="button">
                Herzhaftes Gebäck
            </button>

            <button class="filter-item" data-cat="Fleisch" type="button">
                Fleisch
            </button>

            <button class="filter-item" data-cat="Fisch" type="button">
                Fisch
            </button>

            <button class="filter-item" data-cat="Vegetarisch" type="button">
                Vegetarisch
            </button>

            <button class="filter-item" data-cat="Vegan" type="button">
                Vegan
            </button>

        </div>

    </div>

</section>



<!-- =========================================
     REZEPTE
========================================= -->

<section class="recipes-section">

    <div
        class="recipe-grid"
        id="recipeGrid"
    ></div>

</section>



</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer class="recipes-footer">

    <strong>
        KitchenBreeze
    </strong>

    <p>
        Selbst gemacht schmeckt einfach besser.
    </p>

</footer>



<script src="recipes.js"></script>


<script>

/* =========================================
   SLUG
========================================= */

function createSlug(title) {

    return title
        .toLowerCase()
        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("ß", "ss")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-");

}


/* =========================================
   ELEMENTE
========================================= */

const grid =
    document.getElementById("recipeGrid");

const searchInput =
    document.getElementById("searchInput");

const filterBtn =
    document.getElementById("filterBtn");

const filterDropdown =
    document.getElementById("filterDropdown");

const filterItems =
    document.querySelectorAll(".filter-item");


/* =========================================
   URL-PARAMETER
========================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


/* =========================================
   KATEGORIEN AUS URL LADEN
========================================= */

const urlCategories =
    urlParams.getAll("category");


/* =========================================
   SCHNELLFILTER AUS URL
========================================= */

const quickFilter =
    urlParams.get("quick") === "true";


/* =========================================
   AUSGEWÄHLTE KATEGORIEN
========================================= */

let selectedCategories =
    urlCategories.length > 0
        ? urlCategories
        : ["all"];


/* =========================================
   FILTER-BUTTONS AKTIVIEREN
========================================= */

filterItems.forEach(button => {

    const category =
        button.dataset.cat;

    if (
        selectedCategories.includes(category)
    ) {

        button.classList.add("active");

    } else {

        button.classList.remove("active");

    }

});


/* =========================================
   "ALLE" AKTIVIEREN
========================================= */

if (
    selectedCategories.includes("all")
) {

    const allButton =
        document.querySelector(
            '[data-cat="all"]'
        );

    if (allButton) {

        allButton.classList.add("active");

    }

}


/* =========================================
   FILTER MENÜ
========================================= */

filterBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        filterDropdown.classList.toggle(
            "open"
        );

    }
);


document.addEventListener(
    "click",
    event => {

        if (
            !filterDropdown.contains(
                event.target
            ) &&
            event.target !== filterBtn
        ) {

            filterDropdown.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================
   URL MIT AKTUELLEM FILTER AKTUALISIEREN
========================================= */

function updateUrl() {

    const params =
        new URLSearchParams();


    /* Kategorien */

    selectedCategories
        .filter(category =>
            category !== "all"
        )
        .forEach(category => {

            params.append(
                "category",
                category
            );

        });


    /* Schnellfilter */

    if (quickFilter) {

        params.set(
            "quick",
            "true"
        );

    }


    const query =
        params.toString();


    const newUrl =
        query
            ? "rezepte.html?" + query
            : "rezepte.html";


    window.history.replaceState(
        {},
        "",
        newUrl
    );

}


/* =========================================
   KATEGORIEN
========================================= */

filterItems.forEach(item => {

    item.addEventListener(
        "click",
        () => {

            const category =
                item.dataset.cat;


            /* =============================
               ALLE
            ============================= */

            if (
                category === "all"
            ) {

                selectedCategories =
                    ["all"];


                filterItems.forEach(
                    button => {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


                item.classList.add(
                    "active"
                );


                updateUrl();

                render();

                return;

            }


            /* =============================
               "ALLE" ENTFERNEN
            ============================= */

            selectedCategories =
                selectedCategories.filter(
                    cat =>
                        cat !== "all"
                );


            /* =============================
               KATEGORIE AN / AUS
            ============================= */

            if (
                selectedCategories.includes(
                    category
                )
            ) {

                selectedCategories =
                    selectedCategories.filter(
                        cat =>
                            cat !== category
                    );


                item.classList.remove(
                    "active"
                );

            } else {

                selectedCategories.push(
                    category
                );


                item.classList.add(
                    "active"
                );

            }


            /* =============================
               KEINE KATEGORIE
            ============================= */

            if (
                selectedCategories.length === 0
            ) {

                selectedCategories =
                    ["all"];


                filterItems.forEach(
                    button => {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


                const allButton =
                    document.querySelector(
                        '[data-cat="all"]'
                    );


                if (allButton) {

                    allButton.classList.add(
                        "active"
                    );

                }

            }


            /* =============================
               URL SPEICHERN
            ============================= */

            updateUrl();


            /* =============================
               REZEPTE NEU RENDERN
            ============================= */

            render();

        }
    );

});


/* =========================================
   GESAMTZEIT IN MINUTEN UMRECHNEN

   NUR recipe.time.total
========================================= */

function getTotalMinutes(recipe) {

    if (
        !recipe ||
        !recipe.time ||
        !recipe.time.total
    ) {

        return null;

    }


    const total =
        String(
            recipe.time.total
        )
        .toLowerCase()
        .trim();


    let minutes = 0;


    /* =====================================
       STUNDEN
    ===================================== */

    const hours =
        total.match(
            /(\d+(?:[.,]\d+)?)\s*(?:std\.?|stunde(?:n)?|h)/
        );


    if (hours) {

        minutes +=
            parseFloat(
                hours[1].replace(
                    ",",
                    "."
                )
            ) * 60;

    }


    /* =====================================
       MINUTEN
    ===================================== */

    const mins =
        total.match(
            /(\d+)\s*(?:min\.?|minute(?:n)?)/
        );


    if (mins) {

        minutes +=
            Number(
                mins[1]
            );

    }


    /* =====================================
       FALLS NUR ZAHL GESPEICHERT IST
    ===================================== */

    if (
        !hours &&
        !mins
    ) {

        const number =
            total.match(
                /\d+/
            );


        if (!number) {

            return null;

        }


        minutes =
            Number(
                number[0]
            );

    }


    return minutes;

}


/* =========================================
   SUCHE
========================================= */

searchInput.addEventListener(
    "input",
    render
);


/* =========================================
   ZUTATEN FÜR SUCHE
========================================= */

function getIngredientsText(recipe) {

    if (
        !recipe.ingredients
    ) {

        return "";

    }


    /* ARRAY */

    if (
        Array.isArray(
            recipe.ingredients
        )
    ) {

        return recipe.ingredients
            .join(" ")
            .toLowerCase();

    }


    /* OBJEKT */

    if (
        typeof recipe.ingredients ===
        "object"
    ) {

        return Object.values(
            recipe.ingredients
        )
        .flat()
        .join(" ")
        .toLowerCase();

    }


    return String(
        recipe.ingredients
    ).toLowerCase();

}


/* =========================================
   REZEPTE RENDERN
========================================= */

function render() {

    if (
        typeof RECIPES ===
        "undefined"
    ) {

        console.error(
            "RECIPES fehlt! recipes.js prüfen!"
        );

        return;

    }


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        RECIPES

            .slice()


            /* =============================
               NEUESTE ZUERST
            ============================= */

            .sort(
                (a, b) =>
                    Number(b.id) -
                    Number(a.id)
            )


            /* =============================
               KATEGORIEN
            ============================= */

            .filter(
                recipe => {

                    if (
                        selectedCategories.includes(
                            "all"
                        )
                    ) {

                        return true;

                    }


                    const categories =
                        Array.isArray(
                            recipe.category
                        )
                            ? recipe.category
                            : [];


                    /*
                       Mehrere Kategorien:

                       Vegetarisch + Pasta

                       bedeutet:
                       Vegetarisch ODER Pasta
                    */

                    return selectedCategories.some(
                        category =>
                            categories.includes(
                                category
                            )
                    );

                }
            )


            /* =============================
               SCHNELL & EINFACH
               
               GESAMTZEIT <= 45 MINUTEN
            ============================= */

            .filter(
                recipe => {

                    if (
                        !quickFilter
                    ) {

                        return true;

                    }


                    const totalMinutes =
                        getTotalMinutes(
                            recipe
                        );


                    if (
                        totalMinutes === null
                    ) {

                        return false;

                    }


                    return (
                        totalMinutes <= 45
                    );

                }
            )


            /* =============================
               SUCHE
            ============================= */

            .filter(
                recipe => {

                    if (!search) {

                        return true;

                    }


                    const title =
                        String(
                            recipe.title ||
                            ""
                        )
                        .toLowerCase();


                    const description =
                        String(
                            recipe.description ||
                            ""
                        )
                        .toLowerCase();


                    const ingredients =
                        getIngredientsText(
                            recipe
                        );


                    const category =
                        Array.isArray(
                            recipe.category
                        )
                            ? recipe.category
                                .join(" ")
                                .toLowerCase()
                            : "";


                    return (

                        title.includes(
                            search
                        )

                        ||

                        description.includes(
                            search
                        )

                        ||

                        ingredients.includes(
                            search
                        )

                        ||

                        category.includes(
                            search
                        )

                    );

                }
            );


    /* =====================================
       GRID LEEREN
    ===================================== */

    grid.innerHTML = "";


    /* =====================================
       REZEPTE AUSGEBEN
    ===================================== */

    filtered.forEach(
        recipe => {


            /* =============================
               REZEPT-URL
            ============================= */

            let recipeUrl =
                "recipes/" +
                createSlug(
                    recipe.title
                ) +
                ".html";


            const filterParams =
                new URLSearchParams();


            /* =============================
               AKTUELLE KATEGORIEN MITGEBEN
            ============================= */

            const activeCategories =
                selectedCategories.filter(
                    category =>
                        category !== "all"
                );


            activeCategories.forEach(
                category => {

                    filterParams.append(
                        "category",
                        category
                    );

                }
            );


            /* =============================
               SCHNELLFILTER MITGEBEN
            ============================= */

            if (
                quickFilter
            ) {

                filterParams.set(
                    "quick",
                    "true"
                );

            }


            /* =============================
               PARAMETER AN REZEPT ANHÄNGEN
            ============================= */

            const queryString =
                filterParams.toString();


            if (queryString) {

                recipeUrl +=
                    "?" +
                    queryString;

            }


            /* =============================
               REZEPTKARTE
            ============================= */

            grid.innerHTML += `

                <a
                    class="recipe-card"
                    href="${recipeUrl}"
                >

                    <div
                        class="recipe-card-image"
                    >

                        <img
                            src="${recipe.image}"
                            alt="${recipe.title}"
                            loading="lazy"
                        >

                    </div>


                    <div
                        class="recipe-card-content"
                    >

                        <h2>
                            ${recipe.title}
                        </h2>

                        <p>
                            ${
                                recipe.description ||
                                ""
                            }
                        </p>

                    </div>

                </a>

            `;

        }
    );


    /* =====================================
       KEINE ERGEBNISSE
    ===================================== */

    if (
        !filtered.length
    ) {

        let message =
            "Versuche eine andere Suche oder Kategorie.";


        if (
            quickFilter &&
            !search
        ) {

            message =
                "Es gibt keine Rezepte mit einer Gesamtzeit von höchstens 45 Minuten.";

        }


        grid.innerHTML = `

            <div
                class="no-results"
            >

                <h2>
                    Keine Rezepte gefunden
                </h2>

                <p>
                    ${message}
                </p>

            </div>

        `;

    }

}


/* =========================================
   START
========================================= */

render();

</script>


</body>
</html>
