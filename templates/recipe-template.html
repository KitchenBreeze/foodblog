<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KitchenBreeze Rezept</title>

<meta id="metaDescription" name="description" content="">

<script id="recipeSchema" type="application/ld+json"></script>

<link rel="icon" type="image/png" href="../logo1.png">
<link rel="stylesheet" href="../recipe-style.css">

<style>
.step-images {
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.step-image {
    width:280px;
    height:280px;
    object-fit:contain;
    border-radius:20px;
}
    

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #0f0f10;
    color: #f2eee9;
}

/* TOP */
.topbar {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.back {
    color: #b8b2aa;
    text-decoration: none;
    font-size: 14px;
}

/* HERO */
.hero-img {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    border-radius: 18px;
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* TITLE */
.title {
    font-size: 40px;
    font-weight: 300;
    margin: 20px 0 5px;
    text-align: center;
}

/* TIME + INFO */
.time-row,
.info-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 25px;
    text-align: center;
    width: 100%;
    margin: 25px auto;
}

.time-row > div,
.info-row > div {
    text-align: center;
    min-width: 120px;
}

.time-row strong {
    display: block;
    margin-top: 6px;
    font-size: 18px;
    color: white;
}

/* BUTTONS */
.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}

button {
    background: #171718;
    border: 1px solid #2a2a2a;
    color: #f2eee9;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #222;
}

/* CARD */
.card {
    background: transparent;
    border-radius: 0;
    padding: 30px 0;
    margin-top: 0;
    border-top: 1px solid #2a2a2a;
}

.card h2 {
    font-size: 24px;
    font-weight: 400;
    margin: 0 0 22px;
    color: #f2eee9;
}

.ingredient-list li {
    margin-bottom: 14px;
}

/* INGREDIENTS */
.ingredient-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.ingredient-list li {
    margin-bottom: 10px;
}

.ingredient-list label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: #ddd;
}

.ingredient-list input {
    width: 18px;
    height: 18px;
    accent-color: white;
}

/* STEPS */
.step {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
}

.step-number {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 50%;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
}

.step-text {
    color: #ddd;
    flex:1;
}

    @page {
        size: A4;
        margin: 1.5cm;
    }

    body {
        background: white !important;
        color: black !important;
        font-family: Georgia, serif;
        font-size: 12pt;
    }


    /* AUSBLENDEN */

    .topbar,
    .buttons,
    .back,
    input[type="checkbox"],
    footer,
    .related-section {
        display: none !important;
    }


    /* CONTAINER */

    .container {
        max-width: 100%;
        padding: 0;
        margin: 0 auto;
    }


    /* TITEL */

    .title {
        text-align: center;
        font-size: 28pt;
        color: black !important;
        margin-bottom: 20px;
        page-break-after: avoid;
    }


    /* HAUPTBILD */

    .hero-img {
        display: block;
        margin: 0 auto 10px auto;
        width: 45%;
        max-height: 150px;
        object-fit: cover;
        border-radius: 10px;
    }


    /* BESCHREIBUNG AUSBLENDEN */

    p[style*="text-align:center"] {
        display: none !important;
    }


    /* ZEITEN + INFOS */

    .time-row,
    .info-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        text-align: center;
        margin: 8px 0;
        color: black !important;
        font-size: 11pt;
    }


    .time-row strong {
        display: block;
        font-size: 13pt;
        margin-top: 4px;
        color: black !important;
    }


    /* ZUTATEN / ZUBEREITUNG BOXEN */

    .card {

        background: white !important;
        color: black !important;

        border: none;
        padding: 0;
        margin-top: 15px;

        page-break-inside: avoid;
    }


    .card h2 {

        color: black !important;

        border-bottom: 1px solid #999;
        padding-bottom: 5px;
        margin-bottom: 15px;
    }



    /* ZUTATEN */

    .ingredient-list {

        list-style: disc;
        padding-left: 20px;
    }


    .ingredient-list label {

        display: inline;
        color: black !important;
    }


    .ingredient-list input {

        display: none;
    }



    /* ZUBEREITUNG */

    .step {

        display: flex !important;

        gap: 12px;

        margin-bottom: 15px;

        page-break-inside: avoid;
    }


    .step-number {

        display: flex !important;

        align-items: center;
        justify-content: center;

        background: none !important;

        color: black !important;

        font-weight: bold;

        width: 25px;
        min-width: 25px;
    }


    .step-text {

        display: block !important;

        flex: 1;

        color: black !important;
    }


    .step-text p {

        color: black !important;
    }



    /* SCHRITTBILDER AUSBLENDEN */

    .step-images {

        display: none !important;
    }



    /* LISTEN / TIPPS */

    ul {

        color: black !important;
    }


    li {

        color: black !important;
    }



    /* PRINT FOOTER */

    .print-footer {

        display: block;

        text-align: center;

        font-size: 8pt;

        color: #888;

        margin-top: 60px;
    }

}

</style>

</head>

<body>

<div id="content"></div>

<!-- RECIPE_DATA -->

<script>

/* =========================================
   SLUG
========================================= */

function createSlug(title) {
    return title
        .toLowerCase()
        .replaceAll("ä", "ae")
        .replaceAll("ö", "oe")
        .replaceAll("ü", "ue")
        .replaceAll("ß", "ss")
        .replace(/[^a-z0-9\s-]/g, "")
        .replace(/\s+/g, "-");
}


/* =========================================
   ELEMENTE
========================================= */

const grid =
    document.getElementById("recipeGrid");

const searchInput =
    document.getElementById("searchInput");

const filterBtn =
    document.getElementById("filterBtn");

const filterDropdown =
    document.getElementById("filterDropdown");

const filterItems =
    document.querySelectorAll(".filter-item");


/* =========================================
   URL-PARAMETER
========================================= */

const urlParams =
    new URLSearchParams(window.location.search);

const urlCategories =
    urlParams.get("categories");

const quickFilter =
    urlParams.get("quick") === "true";


/* =========================================
   AUS URL GELADENE KATEGORIEN
========================================= */

let selectedCategories = [];

if (urlCategories) {

    selectedCategories =
        urlCategories
            .split(",")
            .map(category =>
                decodeURIComponent(category)
            )
            .filter(Boolean);

}

if (selectedCategories.length === 0) {
    selectedCategories = ["all"];
}


/* =========================================
   FILTER BUTTONS AKTIVIEREN
========================================= */

filterItems.forEach(item => {

    const category =
        item.dataset.cat;

    item.classList.remove("active");

    if (
        selectedCategories.includes(category)
    ) {
        item.classList.add("active");
    }

});


/* =========================================
   "ALLE" AKTIVIEREN
========================================= */

if (
    selectedCategories.includes("all")
) {

    const allButton =
        document.querySelector(
            '[data-cat="all"]'
        );

    if (allButton) {
        allButton.classList.add("active");
    }

}


/* =========================================
   FILTER MENÜ
========================================= */

filterBtn.addEventListener("click", event => {

    event.stopPropagation();

    filterDropdown.classList.toggle("open");

});


document.addEventListener("click", event => {

    if (
        !filterDropdown.contains(event.target) &&
        event.target !== filterBtn
    ) {

        filterDropdown.classList.remove("open");

    }

});


/* =========================================
   KATEGORIEN
========================================= */

filterItems.forEach(item => {

    item.addEventListener("click", () => {

        const category =
            item.dataset.cat;


        /* ================================
           ALLE
        ================================= */

        if (category === "all") {

            selectedCategories = ["all"];

            filterItems.forEach(button => {
                button.classList.remove("active");
            });

            item.classList.add("active");

            updateUrl();

            render();

            return;
        }


        /* ================================
           "ALLE" ENTFERNEN
        ================================= */

        selectedCategories =
            selectedCategories.filter(
                cat => cat !== "all"
            );


        /* ================================
           KATEGORIE AN / AUS
        ================================= */

        if (
            selectedCategories.includes(category)
        ) {

            selectedCategories =
                selectedCategories.filter(
                    cat => cat !== category
                );

            item.classList.remove("active");

        } else {

            selectedCategories.push(category);

            item.classList.add("active");

        }


        /* ================================
           KEINE KATEGORIE
        ================================= */

        if (
            selectedCategories.length === 0
        ) {

            selectedCategories = ["all"];

            filterItems.forEach(button => {
                button.classList.remove("active");
            });

            const allButton =
                document.querySelector(
                    '[data-cat="all"]'
                );

            if (allButton) {
                allButton.classList.add("active");
            }

        }


        updateUrl();

        render();

    });

});


/* =========================================
   URL AKTUALISIEREN
========================================= */

function updateUrl() {

    const params =
        new URLSearchParams();


    /* Kategorien */

    const categories =
        selectedCategories.filter(
            category => category !== "all"
        );


    if (categories.length > 0) {

        params.set(
            "categories",
            categories
                .map(category =>
                    encodeURIComponent(category)
                )
                .join(",")
        );

    }


    /* Schnellfilter */

    if (quickFilter) {

        params.set(
            "quick",
            "true"
        );

    }


    const query =
        params.toString();


    const newUrl =
        query
            ? `${window.location.pathname}?${query}`
            : window.location.pathname;


    window.history.replaceState(
        {},
        "",
        newUrl
    );

}


/* =========================================
   SUCHE
========================================= */

searchInput.addEventListener(
    "input",
    render
);


/* =========================================
   GESAMTZEIT IN MINUTEN
========================================= */

function getTotalMinutes(recipe) {

    if (
        !recipe ||
        !recipe.time ||
        !recipe.time.total
    ) {
        return Infinity;
    }


    const time =
        String(recipe.time.total)
            .toLowerCase()
            .trim();


    let minutes = 0;


    /* Stunden */

    const hoursMatch =
        time.match(
            /(\d+(?:[.,]\d+)?)\s*(?:stunden?|std\.?|h)/
        );


    if (hoursMatch) {

        minutes +=
            parseFloat(
                hoursMatch[1]
                    .replace(",", ".")
            ) * 60;

    }


    /* Minuten */

    const minutesMatch =
        time.match(
            /(\d+)\s*(?:minuten?|min\.?|m)/
        );


    if (minutesMatch) {

        minutes +=
            parseInt(
                minutesMatch[1],
                10
            );

    }


    /* Falls nur eine Zahl gespeichert ist */

    if (
        !hoursMatch &&
        !minutesMatch
    ) {

        const numberOnly =
            time.match(/^\d+$/);

        if (numberOnly) {

            minutes =
                parseInt(
                    numberOnly[0],
                    10
                );

        }

    }


    return minutes || Infinity;

}


/* =========================================
   ZUTATEN FÜR SUCHE
========================================= */

function getIngredientsText(recipe) {

    if (!recipe.ingredients) {
        return "";
    }


    if (Array.isArray(recipe.ingredients)) {

        return recipe.ingredients
            .join(" ")
            .toLowerCase();

    }


    if (
        typeof recipe.ingredients === "object"
    ) {

        return Object.values(
            recipe.ingredients
        )
        .flat()
        .join(" ")
        .toLowerCase();

    }


    return String(
        recipe.ingredients
    ).toLowerCase();

}


/* =========================================
   RENDER
========================================= */

function render() {

    if (
        typeof RECIPES === "undefined"
    ) {

        console.error(
            "RECIPES fehlt! recipes.js prüfen!"
        );

        return;

    }


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filtered =
        RECIPES
            .slice()


            /* =============================
               NEUESTE ZUERST
            ============================= */

            .sort(
                (a, b) =>
                    Number(b.id) -
                    Number(a.id)
            )


            /* =============================
               KATEGORIEN
            ============================= */

            .filter(recipe => {

                if (
                    selectedCategories.includes("all")
                ) {
                    return true;
                }


                const categories =
                    Array.isArray(recipe.category)
                        ? recipe.category
                        : [];


                return selectedCategories.some(
                    category =>
                        categories.includes(category)
                );

            })


            /* =============================
               SCHNELL & EINFACH
               GESAMTZEIT <= 45 MINUTEN
            ============================= */

            .filter(recipe => {

                if (!quickFilter) {
                    return true;
                }


                return (
                    getTotalMinutes(recipe) <= 45
                );

            })


            /* =============================
               SUCHE
            ============================= */

            .filter(recipe => {

                if (!search) {
                    return true;
                }


                const title =
                    String(
                        recipe.title || ""
                    ).toLowerCase();


                const description =
                    String(
                        recipe.description || ""
                    ).toLowerCase();


                const ingredients =
                    getIngredientsText(recipe);


                const category =
                    Array.isArray(recipe.category)
                        ? recipe.category
                            .join(" ")
                            .toLowerCase()
                        : "";


                return (
                    title.includes(search) ||
                    description.includes(search) ||
                    ingredients.includes(search) ||
                    category.includes(search)
                );

            });


    /* =====================================
       GRID LEEREN
    ===================================== */

    grid.innerHTML = "";


    /* =====================================
       REZEPTE AUSGEBEN
    ===================================== */

    filtered.forEach(recipe => {


        /* =================================
           FILTER FÜR REZEPT SPEICHERN
        ================================= */

        const params =
            new URLSearchParams();


        const activeCategories =
            selectedCategories.filter(
                category =>
                    category !== "all"
            );


        if (
            activeCategories.length > 0
        ) {

            params.set(
                "categories",
                activeCategories
                    .map(category =>
                        encodeURIComponent(category)
                    )
                    .join(",")
            );

        }


        /* Schnellfilter */

        if (quickFilter) {

            params.set(
                "quick",
                "true"
            );

        }


        /* =================================
           REZEPT URL
        ================================= */

        let recipeUrl =
            `recipes/${createSlug(recipe.title)}.html`;


        const query =
            params.toString();


        if (query) {

            recipeUrl +=
                `?${query}`;

        }


        /* =================================
           REZEPTKARTE
        ================================= */

        grid.innerHTML += `

            <a
                class="recipe-card"
                href="${recipeUrl}"
            >

                <div class="recipe-card-image">

                    <img
                        src="${recipe.image}"
                        alt="${recipe.title}"
                        loading="lazy"
                    >

                </div>


                <div class="recipe-card-content">

                    <h2>
                        ${recipe.title}
                    </h2>

                    <p>
                        ${recipe.description || ""}
                    </p>

                </div>

            </a>

        `;

    });


    /* =====================================
       KEINE ERGEBNISSE
    ===================================== */

    if (!filtered.length) {

        let message =
            "Versuche eine andere Suche oder Kategorie.";


        if (quickFilter) {

            message =
                "Es gibt keine Rezepte mit einer Gesamtzeit von höchstens 45 Minuten.";

        }


        grid.innerHTML = `

            <div class="no-results">

                <h2>
                    Keine Rezepte gefunden
                </h2>

                <p>
                    ${message}
                </p>

            </div>

        `;

    }

}


/* =========================================
   START
========================================= */

render();

</script>

</body>
</html>
