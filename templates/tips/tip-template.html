<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tipps & Tricks - KitchenBreeze</title>

    <link
        rel="icon"
        type="image/png"
        href="../logo1.png"
    >

    <style>

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #0f0f10;
            color: #f2eee9;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        .back {
            color: #b8b2aa;
            text-decoration: none;
        }

        h1 {
            font-weight: 300;
            margin-bottom: 10px;
        }

        .description {
            color: #b8b2aa;
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .hero-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 16px;
            margin: 25px 0 35px;
        }

        .tip-section {
            margin-top: 35px;
        }

        .tip-section h2 {
            font-weight: 400;
            margin-bottom: 12px;
        }

        .tip-section p {
            color: #d0cbc5;
            line-height: 1.8;
        }

        .tip-section img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 15px;
        }

        .tip-video {
            margin-top: 20px;
            aspect-ratio: 16 / 9;
        }

        .tip-video iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 14px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <a
        class="back"
        href="../tipps-tricks.html"
    >
        ← Zurück zu Tipps & Tricks
    </a>


    <!-- TIP_DATA -->


    <article>

        <h1 id="tip-title"></h1>

        <p
            class="description"
            id="tip-description"
        ></p>

        <img
            class="hero-image"
            id="tip-image"
            src=""
            alt=""
        >

        <div id="tip-content"></div>

    </article>

</div>


<script>

const TIP_DATA = /* TIP_DATA_PLACEHOLDER */ null;


document.title =
    TIP_DATA.title +
    " - KitchenBreeze";


document.getElementById(
    "tip-title"
).textContent =
    TIP_DATA.title;


document.getElementById(
    "tip-description"
).textContent =
    TIP_DATA.description;


const heroImage =
    document.getElementById(
        "tip-image"
    );

heroImage.src =
    "../" + TIP_DATA.image;

heroImage.alt =
    TIP_DATA.title;


const content =
    document.getElementById(
        "tip-content"
    );


if (
    Array.isArray(
        TIP_DATA.sections
    )
) {

    TIP_DATA.sections.forEach(
        section => {

            const sectionElement =
                document.createElement(
                    "section"
                );

            sectionElement.className =
                "tip-section";


            if (section.title) {

                const heading =
                    document.createElement(
                        "h2"
                    );

                heading.textContent =
                    section.title;

                sectionElement.appendChild(
                    heading
                );

            }


            if (section.text) {

                const paragraph =
                    document.createElement(
                        "p"
                    );

                paragraph.textContent =
                    section.text;

                sectionElement.appendChild(
                    paragraph
                );

            }


            if (section.image) {

                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    "../" + section.image;

                image.alt =
                    section.alt ||
                    section.title ||
                    TIP_DATA.title;

                sectionElement.appendChild(
                    image
                );

            }


            if (section.video) {

                const videoWrapper =
                    document.createElement(
                        "div"
                    );

                videoWrapper.className =
                    "tip-video";


                const iframe =
                    document.createElement(
                        "iframe"
                    );

                iframe.src =
                    section.video;

                iframe.title =
                    section.title ||
                    TIP_DATA.title;

                iframe.allowFullscreen =
                    true;

                videoWrapper.appendChild(
                    iframe
                );

                sectionElement.appendChild(
                    videoWrapper
                );

            }


            content.appendChild(
                sectionElement
            );

        }
    );

}

</script>

</body>

</html>
