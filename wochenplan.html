<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background: var(--kb-bg);
    color: var(--kb-text);
}

header {
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.plan-box {
    background: var(--kb-card);
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.filter-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.filter-buttons button {
    padding: 10px 18px;
    border: 1px solid #ccc;
    border-radius: 20px;
   background: var(--kb-card);
    cursor: pointer;
}

.filter-buttons button.active {
    background: #333;
    color: white;
}

.generate-button {
    display: block;
    margin: 20px auto;
    padding: 13px 25px;
    border: none;
    border-radius: 25px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.week-plan {
    margin-top: 30px;
}

.day {
    padding: 20px 0;
    border-bottom: 1px solid #eee;
}

.day:last-child {
    border-bottom: none;
}

.day-name {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.recipe-card {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
    color: inherit;
    background: var(--kb-card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.recipe-card img {
    width: 130px;
    height: 100px;
    object-fit: cover;
    flex-shrink: 0;
}

.recipe-card-content {
    padding: 12px 15px;
}

.recipe-card-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.recipe-card-time {
    font-size: 14px;
    color: #666;
}

@media (max-width: 600px) {

    .recipe-card img {
        width: 110px;
        height: 90px;
    }

    .recipe-card-title {
        font-size: 16px;
    }

}

.day:last-child {
    border-bottom: none;
}

.day-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.recipe-link {
    color: #333;
    text-decoration: underline;
}

.recipe-time-icon {
    position: relative;
    display: inline-block;

    width: 15px;
    height: 15px;

    flex: 0 0 15px;

    border: 1.5px solid var(--kb-accent);
    border-radius: 50%;
}

.recipe-time-icon::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 2.5px;

    width: 1.5px;
    height: 5px;

    transform: translateX(-50%);

    background: var(--kb-accent);
    border-radius: 2px;
}

.recipe-time-icon::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 1.5px;

    transform: translateY(-50%);

    background: var(--kb-accent);
    border-radius: 2px;
}

.back-link {
    display: inline-block;
    margin: 35px 30px 0;
    color: var(--kb-text);
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}
</style>

<header>

<h1> Wochenplan</h1>

<p>Dein zufälliger Wochenplan aus den Hauptgerichten</p>

</header>

<main>

<div class="plan-box">

<h2>Was möchtest du essen?</h2>

<div class="filter-buttons">

<button
    type="button"
    class="active"
    data-filter="Alle"
>
    Alle
</button>

<button
    type="button"
    data-filter="Vegetarisch"
>
     Vegetarisch
</button>

<button
    type="button"
    data-filter="Vegan"
>
     Vegan
</button>

<button type="button" data-filter="Schnell & einfach"> Schnell & einfach</button>

</div>

<button
    type="button"
    class="generate-button"
    id="generatePlan"
>
     Wochenplan erstellen
</button>

<div
    class="week-plan"
    id="weekPlan"
></div>

</div>

</main>
<script src="recipes.js"></script>

<script>
const filterButtons = document.querySelectorAll(".filter-buttons button");
const generateButton = document.getElementById("generatePlan");
const weekPlan = document.getElementById("weekPlan");

let selectedFilter = "Alle";

filterButtons.forEach(button => {
    button.addEventListener("click", () => {
        filterButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        selectedFilter = button.dataset.filter;
    });
});

// Zeit in Minuten berechnen
function getTotalMinutes(recipe) {
    const total = recipe.time?.total || "";
    const hours = total.match(/(\d+)\s*Std/i);
    const minutes = total.match(/(\d+)\s*min/i);

    return (hours ? Number(hours[1]) * 60 : 0) +
           (minutes ? Number(minutes[1]) : 0);
}

// Kategorien eines Rezepts auslesen
function getCategories(recipe) {
    return Array.isArray(recipe.category) ? recipe.category : [];
}

// Zufälliges Element auswählen
function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
}

// Rezepte zufällig mischen
function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }

    return result;
}

generateButton.addEventListener("click", () => {

    // =====================================
    // 1. HAUPTGERICHTE FILTERN
    // =====================================

    let mainDishes = RECIPES.filter(recipe => {
        const categories = getCategories(recipe);

        return categories.includes("Hauptgerichte");
    });

    // Vegetarisch / Vegan
    if (
        selectedFilter === "Vegetarisch" ||
        selectedFilter === "Vegan"
    ) {
        mainDishes = mainDishes.filter(recipe =>
            getCategories(recipe).includes(selectedFilter)
        );
    }

    // Schnell & einfach
    if (selectedFilter === "Schnell & einfach") {
        mainDishes = mainDishes.filter(recipe =>
            recipe.difficulty === "Einfach" &&
            getTotalMinutes(recipe) <= 45
        );
    }

    // Doppelte Rezepte anhand der ID oder des Titels entfernen
    const uniqueRecipes = [];
    const seenRecipes = new Set();

    mainDishes.forEach(recipe => {
        const key = recipe.id ?? recipe.title;

        if (!seenRecipes.has(key)) {
            seenRecipes.add(key);
            uniqueRecipes.push(recipe);
        }
    });

    mainDishes = uniqueRecipes;

    if (mainDishes.length < 7) {
        weekPlan.innerHTML =
            "<p>Für diese Auswahl sind nicht genug verschiedene Hauptgerichte vorhanden.</p>";
        return;
    }

    // =====================================
    // 2. BACKWAREN SELTEN BERÜCKSICHTIGEN
    // =====================================

    // Nur 5 % Chance, überhaupt ein Backwaren-Rezept
    // in den Wochenplan aufzunehmen.
    let bakeryRecipe = null;

    if (Math.random() < 0.05) {

        let bakeryRecipes = RECIPES.filter(recipe => {
            const categories = getCategories(recipe);

            const isBakery =
                categories.includes("Backen") &&
                (
                    categories.includes("Brot & Brötchen") ||
                    categories.includes("Belegte Backwaren")
                );

            if (!isBakery) return false;

            if (
                selectedFilter === "Vegetarisch" ||
                selectedFilter === "Vegan"
            ) {
                if (!categories.includes(selectedFilter)) {
                    return false;
                }
            }

            if (selectedFilter === "Schnell & einfach") {
                if (
                    recipe.difficulty !== "Einfach" ||
                    getTotalMinutes(recipe) > 45
                ) {
                    return false;
                }
            }

            return true;
        });

        // Keine doppelten Rezepte im Plan
        bakeryRecipes = bakeryRecipes.filter(recipe =>
            !mainDishes.some(main =>
                main.id === recipe.id ||
                main.title === recipe.title
            )
        );

        if (bakeryRecipes.length > 0) {
            bakeryRecipe = randomItem(bakeryRecipes);
        }
    }

    // =====================================
    // 3. AUSWAHL MIT ABWECHSLUNG
    // =====================================

    const selectedRecipes = [];
    const selectedIds = new Set();

    let pastaCount = 0;
    let riceCount = 0;
    let saladCount = 0;
    let soupCount = 0;
    let sweetCount = 0;
    let bakeryCount = 0;

    // Kategorien, die möglichst abwechslungsreich
    // vorkommen sollen.
    const varietyCategories = [
        "Fleisch",
        "Fisch",
        "Vegetarisch",
        "Vegan",
        "Pasta",
        "Reis",
        "Salate",
        "Suppen & Eintöpfe",
        "Beilagen",
        "Pfannengerichte",
        "Ofengerichte",
        "Airfryer"
    ];

    // =====================================
    // 4. BACKWAREN FÜR EINEN TAG RESERVIEREN
    // =====================================

    if (bakeryRecipe) {
        selectedRecipes.push(bakeryRecipe);

        selectedIds.add(
            bakeryRecipe.id ?? bakeryRecipe.title
        );

        bakeryCount++;
    }

    // =====================================
    // 5. HAUPTGERICHTE AUSWÄHLEN
    // =====================================

    let candidates = shuffle(mainDishes);

    while (selectedRecipes.length < 7) {

        // Bereits verwendete Rezepte ausschließen
        candidates = candidates.filter(recipe => {
            const key = recipe.id ?? recipe.title;
            return !selectedIds.has(key);
        });

        if (candidates.length === 0) break;

        // Für jedes Rezept eine Punktzahl berechnen.
        // Rezepte aus bisher wenig vertretenen Kategorien
        // erhalten höhere Chancen.
        const scoredRecipes = candidates.map(recipe => {

            const categories = getCategories(recipe);
            let score = Math.random() * 3;

            const isPasta = categories.includes("Pasta");
            const isRice = categories.includes("Reis");

            const isSalad = categories.includes("Salate");

            const isSoup =
                categories.includes("Suppen & Eintöpfe") ||
                categories.includes("Suppen") ||
                categories.includes("Eintöpfe");

            const isSweet =
                categories.includes("Süß") ||
                categories.includes("süße Hauptgerichte");

            const isBakery =
                categories.includes("Brot & Brötchen") ||
                categories.includes("Belegte Backwaren");

            // Höchstgrenzen
            if (isPasta && pastaCount >= 2) return null;
            if (isRice && riceCount >= 2) return null;
            if (isSalad && saladCount >= 3) return null;
            if (isSoup && soupCount >= 2) return null;
            if (isSweet && sweetCount >= 1) return null;
            if (isBakery && bakeryCount >= 1) return null;

            // Süße Hauptgerichte und Backwaren selten halten
            if (isSweet) score -= 5;
            if (isBakery) score -= 5;

            // Neue Kategorien bevorzugen
            varietyCategories.forEach(category => {
                if (categories.includes(category)) {

                    const alreadyRepresented =
                        selectedRecipes.some(selected =>
                            getCategories(selected).includes(category)
                        );

                    if (!alreadyRepresented) {
                        score += 5;
                    }
                }
            });

            // Gerichte mit mehreren bereits vertretenen
            // Kategorien nicht automatisch bevorzugen
            return { recipe, score };
        }).filter(Boolean);

        if (scoredRecipes.length === 0) break;

        scoredRecipes.sort((a, b) => b.score - a.score);

        // Aus den drei bestbewerteten Rezepten zufällig wählen,
        // damit nicht jede Woche dieselben Gerichte erscheinen.
        const topRecipes = scoredRecipes.slice(0, 3);
        const chosen = randomItem(topRecipes).recipe;

        const categories = getCategories(chosen);

        selectedRecipes.push(chosen);

        selectedIds.add(chosen.id ?? chosen.title);

        if (categories.includes("Pasta")) pastaCount++;
        if (categories.includes("Reis")) riceCount++;
        if (categories.includes("Salate")) saladCount++;

        if (
            categories.includes("Suppen & Eintöpfe") ||
            categories.includes("Suppen") ||
            categories.includes("Eintöpfe")
        ) {
            soupCount++;
        }

        if (
            categories.includes("Süß") ||
            categories.includes("süße Hauptgerichte")
        ) {
            sweetCount++;
        }

        if (
            categories.includes("Brot & Brötchen") ||
            categories.includes("Belegte Backwaren")
        ) {
            bakeryCount++;
        }

        candidates = candidates.filter(recipe =>
            (recipe.id ?? recipe.title) !==
            (chosen.id ?? chosen.title)
        );
    }

    // =====================================
    // 6. WOCHENPLAN AUSGEBEN
    // =====================================

    const days = [
        "Montag",
        "Dienstag",
        "Mittwoch",
        "Donnerstag",
        "Freitag",
        "Samstag",
        "Sonntag"
    ];

    if (selectedRecipes.length < 7) {
        weekPlan.innerHTML =
            "<p>Es konnten nicht genügend unterschiedliche Rezepte mit den gewählten Regeln gefunden werden. Bitte versuche es erneut oder prüfe die Kategorien deiner Rezepte.</p>";
        return;
    }

    weekPlan.innerHTML = selectedRecipes.map((recipe, index) => {

        const slug = recipe.title
            .toLowerCase()
            .replace(/ä/g, "ae")
            .replace(/ö/g, "oe")
            .replace(/ü/g, "ue")
            .replace(/ß/g, "ss")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");

        return `
            <div class="day">
                <div class="day-name">
                    ${days[index]}
                </div>

                <a class="recipe-card" href="recipes/${slug}.html">
                    <img src="${recipe.image}" alt="${recipe.title}">

                    <div class="recipe-card-content">
                        <div class="recipe-card-title">
                            ${recipe.title}
                        </div>

                        <div class="recipe-card-time">
                            <span class="recipe-time-icon" aria-hidden="true"></span>
                            <span>${recipe.time?.total || ""}</span>
                        </div>
                    </div>
                </a>
            </div>
        `;
    }).join("");

});
</script>

<script>

const menuBtn =
    document.getElementById("menuBtn");

const sideMenu =
    document.getElementById("sideMenu");


menuBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        sideMenu.classList.toggle("open");

        const isOpen =
            sideMenu.classList.contains("open");

        menuBtn.setAttribute(
            "aria-expanded",
            isOpen
        );

    }
);


document.addEventListener(
    "click",
    (event) => {

        if (
            !sideMenu.contains(event.target) &&
            !menuBtn.contains(event.target)
        ) {

            sideMenu.classList.remove("open");

            menuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);

</script>
</body>
