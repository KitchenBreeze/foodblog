<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>KitchenBreeze Wochenplan</title>

<link
    rel="icon"
    type="image/png"
    href="logo1.png"
>

<link
    rel="stylesheet"
    href="home.css"
>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background: var(--kb-bg);
    color: var(--kb-text);
}

header {
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}

.plan-box {
    background: var(--kb-card);
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.filter-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.filter-buttons button {
    padding: 10px 18px;
    border: 1px solid #ccc;
    border-radius: 20px;
   background: var(--kb-card);
    cursor: pointer;
}

.filter-buttons button.active {
    background: #333;
    color: white;
}

.generate-button {
    display: block;
    margin: 20px auto;
    padding: 13px 25px;
    border: none;
    border-radius: 25px;
    background: #333;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.week-plan {
    margin-top: 30px;
}

.day {
    padding: 20px 0;
    border-bottom: 1px solid #eee;
}

.day:last-child {
    border-bottom: none;
}

.day-name {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
}

.recipe-card {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
    color: inherit;
    background: var(--kb-card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.recipe-card img {
    width: 130px;
    height: 100px;
    object-fit: cover;
    flex-shrink: 0;
}

.recipe-card-content {
    padding: 12px 15px;
}

.recipe-card-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.recipe-card-time {
    font-size: 14px;
    color: #666;
}

@media (max-width: 600px) {

    .recipe-card img {
        width: 110px;
        height: 90px;
    }

    .recipe-card-title {
        font-size: 16px;
    }

}

.day:last-child {
    border-bottom: none;
}

.day-name {
    font-weight: bold;
    margin-bottom: 5px;
}

.recipe-link {
    color: #333;
    text-decoration: underline;
}

.recipe-time-icon {
    position: relative;
    display: inline-block;

    width: 15px;
    height: 15px;

    flex: 0 0 15px;

    border: 1.5px solid var(--kb-accent);
    border-radius: 50%;
}

.recipe-time-icon::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 2.5px;

    width: 1.5px;
    height: 5px;

    transform: translateX(-50%);

    background: var(--kb-accent);
    border-radius: 2px;
}

.recipe-time-icon::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 4px;
    height: 1.5px;

    transform: translateY(-50%);

    background: var(--kb-accent);
    border-radius: 2px;
}

.back-link {
    display: inline-block;
    margin: 35px 30px 0;
    color: var(--kb-text);
    text-decoration: none;
}

.back-link:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<button
    class="home-menu-button right-menu-button"
    id="menuBtn"
    aria-label="Menü öffnen"
    aria-controls="sideMenu"
    aria-expanded="false"
>

    <span></span>
    <span></span>
    <span></span>

</button>

<nav
    class="home-side-menu right-side-menu"
    id="sideMenu"
    aria-label="Hauptnavigation"
>

    <div class="home-menu-logo">

        <img
            src="images/logo1.png"
            alt="KitchenBreeze"
        >

    </div>

    <a href="index.html">
        Startseite
    </a>

    <a href="rezepte.html">
        Rezepte
    </a>

    <a href="zutatenfinder.html">
        Zutatenfinder
    </a>

    <a href="favoriten.html">
        Favoriten
    </a>

    <a href="wochenplan.html" class="active">
        Wochenplan
    </a>

    <a href="tipps-tricks.html">
        Tipps & Tricks
    </a>

</nav>

<a href="index.html" class="back-link">
    ← Zurück zur Übersicht
</a>

<header>

<h1> Wochenplan</h1>

<p>Dein zufälliger Wochenplan aus den Hauptgerichten</p>

</header>

<main>

<div class="plan-box">

<h2>Was möchtest du essen?</h2>

<div class="filter-buttons">

<button
    type="button"
    class="active"
    data-filter="Alle"
>
    Alle
</button>

<button
    type="button"
    data-filter="Vegetarisch"
>
     Vegetarisch
</button>

<button
    type="button"
    data-filter="Vegan"
>
     Vegan
</button>

<button type="button" data-filter="Schnell & einfach"> Schnell & einfach</button>

</div>

<button
    type="button"
    class="generate-button"
    id="generatePlan"
>
     Wochenplan erstellen
</button>

<div
    class="week-plan"
    id="weekPlan"
></div>

</div>

</main>
<script src="recipes.js"></script>

<script>

const filterButtons =
    document.querySelectorAll(
        ".filter-buttons button"
    );

const generateButton =
    document.getElementById(
        "generatePlan"
    );

const weekPlan =
    document.getElementById(
        "weekPlan"
    );

let selectedFilter = "Alle";


filterButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            filterButtons.forEach(
                btn =>
                    btn.classList.remove(
                        "active"
                    )
            );

            button.classList.add(
                "active"
            );

            selectedFilter =
                button.dataset.filter;

        }
    );

});


generateButton.addEventListener(
    "click",
    () => {

        let mainDishes =
            RECIPES.filter(recipe => {

                const categories =
                    Array.isArray(
                        recipe.category
                    )
                        ? recipe.category
                        : [];

                return categories.includes(
                    "Hauptgerichte"
                );

            });


        /*
        =====================================
        VEGETARISCH / VEGAN
        =====================================
        */

        if (
            selectedFilter === "Vegetarisch" ||
            selectedFilter === "Vegan"
        ) {

            mainDishes =
                mainDishes.filter(
                    recipe => {

                        const categories =
                            Array.isArray(
                                recipe.category
                            )
                                ? recipe.category
                                : [];

                        return categories.includes(
                            selectedFilter
                        );

                    }
                );

        }


        /*
        =====================================
        SCHNELL & EINFACH
        Maximal 45 Minuten
        Schwierigkeit: Einfach
        =====================================
        */

        if (
            selectedFilter ===
            "Schnell & einfach"
        ) {

            mainDishes =
                mainDishes.filter(
                    recipe => {

                        if (
                            recipe.difficulty !==
                            "Einfach"
                        ) {
                            return false;
                        }


                        const total =
                            recipe.time?.total ||
                            "";


                        const hours =
                            total.match(
                                /(\d+)\s*Std/
                            );


                        const minutes =
                            total.match(
                                /(\d+)\s*min/
                            );


                        const totalMinutes =
                            (
                                hours
                                    ? Number(
                                        hours[1]
                                    ) * 60
                                    : 0
                            ) +
                            (
                                minutes
                                    ? Number(
                                        minutes[1]
                                    )
                                    : 0
                            );


                        return (
                            totalMinutes <= 45
                        );

                    }
                );

        }


        /*
        =====================================
        NICHT GENUG REZEPTE
        =====================================
        */

        if (
            mainDishes.length < 7
        ) {

            weekPlan.innerHTML =
                "<p>Für diese Auswahl sind nicht genug verschiedene Hauptgerichte vorhanden.</p>";

            return;

        }


        /*
        =====================================
        REZEPTE ZUFÄLLIG MISCHEN
        =====================================
        */

const shuffled =
    [...mainDishes].sort(
        () =>
            Math.random() - 0.5
    );


const selectedRecipes = [];

let pastaCount = 0;
let sweetCount = 0;
let saladCount = 0;


for (const recipe of shuffled) {

    if (selectedRecipes.length >= 7) {
        break;
    }


    const categories =
        Array.isArray(recipe.category)
            ? recipe.category
            : [];


    const isPasta =
        categories.includes("Pasta");


    const isSweet =
        categories.includes("Süß");


    const isSalad =
        categories.includes("Salate");


    // Pasta maximal 2
    if (
        isPasta &&
        pastaCount >= 2
    ) {
        continue;
    }


    // Süße Hauptgerichte maximal 1
    if (
        isSweet &&
        sweetCount >= 1
    ) {
        continue;
    }


    // Salate maximal 3
    if (
        isSalad &&
        saladCount >= 3
    ) {
        continue;
    }


    selectedRecipes.push(recipe);


    if (isPasta) {
        pastaCount++;
    }


    if (isSweet) {
        sweetCount++;
    }


    if (isSalad) {
        saladCount++;
    }

}
        /*
        =====================================
        WOCHENTAGE
        =====================================
        */

        const days = [

            "Montag",
            "Dienstag",
            "Mittwoch",
            "Donnerstag",
            "Freitag",
            "Samstag",
            "Sonntag"

        ];


        /*
        =====================================
        WOCHENPLAN AUSGEBEN
        =====================================
        */

        weekPlan.innerHTML =
            selectedRecipes.map(
                (recipe, index) => {

                    const slug =
                        recipe.title
                            .toLowerCase()
                            .replace(
                                /ä/g,
                                "ae"
                            )
                            .replace(
                                /ö/g,
                                "oe"
                            )
                            .replace(
                                /ü/g,
                                "ue"
                            )
                            .replace(
                                /ß/g,
                                "ss"
                            )
                            .replace(
                                /[^a-z0-9]+/g,
                                "-"
                            )
                            .replace(
                                /^-+|-+$/g,
                                ""
                            );


                    return `

    <div class="day">

        <div class="day-name">
            ${days[index]}
        </div>


        <a
            class="recipe-card"
            href="recipes/${slug}.html"
        >

            <img
                src="${recipe.image}"
                alt="${recipe.title}"
            >


            <div class="recipe-card-content">

                <div class="recipe-card-title">
                    ${recipe.title}
                </div>


                <div class="recipe-card-time">

                    <span
                        class="recipe-time-icon"
                        aria-hidden="true"
                    ></span>

                    <span>
                        ${recipe.time?.total || ""}
                    </span>

                </div>

            </div>

        </a>

    </div>

`;

                }
            ).join("");

    }
);

</script>

<script>

const menuBtn =
    document.getElementById("menuBtn");

const sideMenu =
    document.getElementById("sideMenu");


menuBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        sideMenu.classList.toggle("open");

        const isOpen =
            sideMenu.classList.contains("open");

        menuBtn.setAttribute(
            "aria-expanded",
            isOpen
        );

    }
);


document.addEventListener(
    "click",
    (event) => {

        if (
            !sideMenu.contains(event.target) &&
            !menuBtn.contains(event.target)
        ) {

            sideMenu.classList.remove("open");

            menuBtn.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);

</script>
</body>

</html>
